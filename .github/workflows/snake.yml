name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Snake (Premium UI)
        uses: Platane/snk@v3
        with:
          github_user_name: Btwitsdksh13
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f5ff&color_dots=#161b22,#0d1117,#0a3069,#1f6feb,#58a6ff
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=#0366d6

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
